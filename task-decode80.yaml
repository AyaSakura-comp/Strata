task: >
  Raise the decode throughput of the Strata inference configuration
  `spec/strata-iq3_s.json` (a committed copy of the production strata-iq3_s.json:
  Qwen3.8-Flash-Next IQ3_S on this ROCm/HIP machine, gfx1151) to at least 80
  decode tokens/sec by the ENGINE's own definition (generated tokens /
  generation ms, from the per-request summary line in the engine log), measured
  by bench/ab_bench.py under the A/B GPU-exclusive protocol (production service
  stopped, 3 cold boots of the production stack with the candidate JSON on port
  8101, one streamed 1024-token-request generation per boot). The measured
  baseline of the unchanged tree is decode_tps_engine = 49.6 tok/s and
  prefill_tps_engine = 1002.2 (boot min 999.2); prefill must stay at or above
  950 tok/s (engine definition: fresh prompt tokens / prompt read ms, cache
  reuse excluded). The bench and its prompt are the fitness function and are
  not yours to change. Only `spec/strata-iq3_s.json` (its `args` list and `env`
  map) is editable: the model pack/native/ple/mtp/tokenizer paths must stay
  the same model; only performance-relevant args and env may change (e.g.
  `--spec`, `--spec-min-p`, `--prefill`, `--kv-resident`, the STRATA_* env
  flags, the hipblaslt tuning table path). The probe boots the production
  engine unchanged, so edits outside the JSON cannot affect the reading.
  Delivering means landing the tuned candidate JSON on the run's branch;
  adopting it as the production /strata-iq3_s.json is a separate human step.

setup:
  repo:
    path: .
    editable:
      - "spec/strata-iq3_s.json"

stages:
  - name: decode-80
    task: >
      Make the candidate spec reach decode_tps_engine >= 80 (median of the
      cold-boot runs) while keeping prefill_tps_engine >= 950, with at least 2
      of 3 boots completing a generation of at least 512 tokens (the bench
      requests 1024; the model's greedy natural stop is ~902). Start by
      reproducing the baseline reading on the unchanged tree (expected:
      decode_tps_engine ~49.6, prefill_tps_engine ~1000), then change ONE lever
      at a time and let the probe grade it. Do not touch anything outside your
      editable region (bench/ is the instrument; the machine's real repo tree
      is the runtime stack).
    knowledge: [perf_claim_protocol]
    measure:
      - name: ab_gpu_exclusive
        version: 3
        run: "python3 bench/ab_bench.py"
        timeout_s: 3600
        reports:
          decode_tps_engine:
            unit: tok/s
            means: median ENGINE decode tokens/sec (generated tokens / generation ms, from the engine's per-request summary line) over the cold-boot runs
          decode_tps_engine_min:
            unit: tok/s
            means: worst single boot, engine view
          prefill_tps_engine:
            unit: tok/s
            means: median ENGINE prefill tokens/sec (1000 * fresh prompt tokens / prompt read ms, cache reuse excluded) over the same runs
          prefill_tps_engine_min:
            unit: tok/s
            means: worst single boot, engine view
          engine_lines:
            unit: count
            means: how many boots yielded a parsed engine summary line (0..3)
          prompt_fresh_tokens:
            unit: count
            means: prompt tokens actually pre-filled per request (cache reuse excluded), per the engine
          decode_tps:
            unit: tok/s
            means: median client-view decode tokens/sec from stream timings (reference only, not gated)
          prefill_tps:
            unit: tok/s
            means: median client-view prompt tokens/sec (prompt_tokens / time-to-first-token, includes connection and queueing; reference only, not gated)
          decode_tps_min:
            unit: tok/s
            means: worst single boot, client view
          prefill_tps_min:
            unit: tok/s
            means: worst single boot, client view
          runs_complete:
            unit: fraction
            means: share of the 3 boots whose generation completed with at least 512 tokens
          prompt_tokens:
            unit: count
            means: prompt tokens per request as reported by the server usage field
          prompt_tokens_estimated:
            unit: flag
            means: 1 when prompt_tokens had to be estimated as chars/4 (must be 0)
    constraints:
      - bound: "decode_tps_engine >= 80"
        on_violation: block
        holds: stage
        why: decode TPS above 80 (engine definition) is the declared goal of this run
      - bound: "prefill_tps_engine >= 950"
        on_violation: block
        holds: stage
        why: prefill must not regress materially below the measured baseline floor (1002.2 median, 999.2 boot min); 950 leaves 5% measurement headroom
      - bound: "runs_complete >= 0.66"
        on_violation: block
        holds: stage
        why: a rate built on fewer than two of three completed boots is noise, not a configuration effect
      - bound: "engine_lines >= 2"
        on_violation: block
        holds: stage
        why: engine-side rates require parsed engine summary lines from at least two boots
      - bound: "prompt_tokens_estimated <= 0"
        on_violation: block
        holds: stage
        why: the comparison must rest on the server's real token counts, not a chars/4 estimate

models:
  framework: {provider: codex}
  worker: {provider: codex}

worker: {kind: pr, max_turns: 40}

budget: {max_usd: 10, max_wall_seconds: 21600, on_limit: pause}

delivery: {mode: local, approval: required}
