task: >
  Raise the decode throughput of the Strata inference configuration
  `spec/strata-iq3_s.json` (a committed copy of the production strata-iq3_s.json:
  Qwen3.8-Flash-Next IQ3_S on this ROCm/HIP machine, gfx1151) to at least 80
  decode tokens/sec, measured by bench/ab_bench.py under the A/B GPU-exclusive
  protocol (production service stopped, 3 cold boots of the production stack
  with the candidate JSON on port 8101, one streamed 1024-token-request
  generation per boot, streaming-token timing). Prefill TPS must stay at or
  above the bound measured from the current baseline spec. The bench and its
  prompt are the fitness function and are not yours to change. Only
  `spec/strata-iq3_s.json` (its `args` list and `env` map) is editable: the
  model pack/native/ple/mtp/tokenizer paths must stay the same model; only
  performance-relevant args and env may change (e.g. `--spec`, `--spec-min-p`,
  `--prefill`, `--kv-resident`, the STRATA_* env flags, the hipblaslt tuning
  table path). The probe boots the production engine unchanged, so edits
  outside the JSON cannot affect the reading. Delivering means landing the
  tuned candidate JSON on the run's branch; adopting it as the production
  /strata-iq3_s.json is a separate human step.

setup:
  repo:
    path: .
    editable:
      - "spec/strata-iq3_s.json"

stages:
  - name: decode-80
    task: >
      Make the candidate spec reach decode_tps >= 80 (median of 3 cold-boot
      runs) while keeping prefill_tps above the declared bound, with all 3 boots
      completing a generation of at least 512 tokens (the bench requests 1024;
      the model's greedy natural stop is ~902). Start by reproducing the
      baseline reading on the unchanged tree, then change ONE lever at a time
      and let the probe grade it. Do not touch anything outside your editable
      region (bench/ is the instrument; the machine's real repo tree is the
      runtime stack).
    knowledge: [perf_claim_protocol]
    measure:
      - name: ab_gpu_exclusive
        version: 2
        run: "python3 bench/ab_bench.py"
        timeout_s: 3600
        reports:
          decode_tps:
            unit: tok/s
            means: median decode tokens/sec over 3 cold-boot runs
          prefill_tps:
            unit: tok/s
            means: median prompt tokens/sec (prompt_tokens / time-to-first-token) over the same runs
          runs_complete:
            unit: fraction
            means: share of the 3 boots whose generation completed with at least 512 tokens
          decode_tps_min:
            unit: tok/s
            means: worst single boot
          prefill_tps_min:
            unit: tok/s
            means: worst single boot
          prompt_tokens:
            unit: count
            means: prompt tokens per request (reported or chars/4 estimate)
          prompt_tokens_estimated:
            unit: flag
            means: 1 when prompt_tokens is a chars/4 estimate
    constraints:
      - bound: "decode_tps >= 80"
        on_violation: block
        holds: stage
        why: decode TPS above 80 is the declared goal of this run
      - bound: "prefill_tps >= 1"
        on_violation: block
        holds: stage
        why: prefill must not regress below the baseline spec's prefill TPS; the exact bound is filled in from the measured baseline before launch
      - bound: "runs_complete >= 1.0"
        on_violation: block
        holds: stage
        why: a TPS from fewer than 3 completed generations of >=512 tokens is a TPS for a shorter and easier bench

models:
  framework: {provider: codex}
  worker: {provider: codex}

worker: {kind: pr, max_turns: 40}

budget: {max_usd: 10, max_wall_seconds: 21600, on_limit: pause}

delivery: {mode: local, approval: required}
