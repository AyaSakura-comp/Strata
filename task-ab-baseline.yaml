task: >
  Baseline only: measure the UNCHANGED tree with bench/ab_bench.py (the A/B
  GPU-exclusive protocol: production strata.service stopped, 3 cold boots of
  the production stack with the candidate spec/strata-iq3_s.json on port 8101,
  one streamed 1024-token-request generation per boot, production restored
  afterwards). Change nothing. The run's reading sets the authoritative
  ENGINE-side prefill floor (prefill_tps_engine) for the decode-80
  optimization task.

setup:
  repo:
    path: .
    editable: ["spec/strata-iq3_s.json"]

stages:
  - name: baseline
    task: >
      Report the A/B cold-boot baseline reading of the unchanged tree. Do not
      modify any file; the number is what matters.
    measure:
      - name: ab_gpu_exclusive_baseline
        version: 3
        run: "python3 bench/ab_bench.py"
        timeout_s: 3600
        reports:
          prefill_tps_engine:
            unit: tok/s
            means: median ENGINE prefill tokens/sec (1000 * fresh prompt tokens / prompt read ms, per the engine's own per-request log line) over the cold boot runs
          prefill_tps_engine_min:
            unit: tok/s
            means: worst single boot, engine view
          decode_tps_engine:
            unit: tok/s
            means: median ENGINE decode tokens/sec (generated tokens / generation ms) over the same runs
          decode_tps_engine_min:
            unit: tok/s
            means: worst single boot, engine view
          engine_lines:
            unit: count
            means: how many boots yielded a parsed engine summary line (0..3)
          prompt_fresh_tokens:
            unit: count
            means: prompt tokens actually pre-filled per request (cache reuse excluded), per the engine
          decode_tps:
            unit: tok/s
            means: median client-view decode tokens/sec from stream timings (reference only)
          prefill_tps:
            unit: tok/s
            means: median client-view prompt tokens/sec (prompt_tokens / time-to-first-token, includes connection and queueing; reference only)
          decode_tps_min:
            unit: tok/s
            means: worst single boot, client view
          prefill_tps_min:
            unit: tok/s
            means: worst single boot, client view
          runs_complete:
            unit: fraction
            means: share of the 3 boots whose generation completed with at least 512 tokens
          prompt_tokens:
            unit: count
            means: prompt tokens per request as reported by the server usage field
          prompt_tokens_estimated:
            unit: flag
            means: 1 when prompt_tokens had to be estimated as chars/4 (must be 0)
    constraints:
      - bound: "runs_complete >= 0.66"
        on_violation: block
        holds: stage
        why: a baseline built on fewer than two of three boots is noise, not a floor
      - bound: "engine_lines >= 2"
        on_violation: block
        holds: stage
        why: the engine-side prefill floor requires parsed engine summary lines from at least two boots
      - bound: "prompt_tokens_estimated <= 0"
        on_violation: block
        holds: stage
        why: the floor must rest on the server's real token counts, not a chars/4 estimate

models:
  framework: {provider: codex}
  worker: {provider: codex}

worker: {kind: pr, max_turns: 5}
budget: {max_usd: 1, max_wall_seconds: 5400, on_limit: pause}
delivery: {mode: local, approval: required}
